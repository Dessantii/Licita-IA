openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: LicitaIA API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: processes
    description: Bidding process management
  - name: files
    description: File upload and management
  - name: requirements
    description: Extracted edital requirements
  - name: documents
    description: Submitted company documents
  - name: validation
    description: Document validation and checklist
  - name: reports
    description: Final reports
  - name: ai
    description: AI processing operations
  - name: chamamentos
    description: Public call notice management (OSC)
  - name: chamamentos-files
    description: File upload for call notices
  - name: chamamentos-ai
    description: AI processing for call notices

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /processes:
    get:
      operationId: listProcesses
      tags: [processes]
      summary: List all processes
      responses:
        "200":
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Process"
    post:
      operationId: createProcess
      tags: [processes]
      summary: Create a new process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcessBody"
      responses:
        "201":
          description: Created process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}:
    get:
      operationId: getProcess
      tags: [processes]
      summary: Get a process by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Process details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProcess
      tags: [processes]
      summary: Update a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcessBody"
      responses:
        "200":
          description: Updated process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProcess
      tags: [processes]
      summary: Delete a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/upload-edital:
    post:
      operationId: uploadEdital
      tags: [files]
      summary: Upload edital PDF for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/upload-document:
    post:
      operationId: uploadDocument
      tags: [files]
      summary: Upload a company document for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/analyze-edital:
    post:
      operationId: analyzeEdital
      tags: [ai]
      summary: Trigger AI analysis of the uploaded edital
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis started or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: No edital uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/analyze-documents:
    post:
      operationId: analyzeDocuments
      tags: [ai]
      summary: Trigger AI analysis and conference of submitted documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: No documents or requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      summary: List extracted requirements for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtractedRequirement"

  /processes/{id}/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List files uploaded for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /processes/{id}/validation:
    get:
      operationId: listValidationItems
      tags: [validation]
      summary: List validation items (checklist) for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationItem"

  /validation/{id}:
    patch:
      operationId: updateValidationItem
      tags: [validation]
      summary: Update a validation item status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateValidationItemBody"
      responses:
        "200":
          description: Updated validation item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /processes/{id}/report:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get the final report for a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Final report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete an uploaded file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos:
    get:
      operationId: listCallNotices
      tags: [chamamentos]
      summary: List all call notices
      responses:
        "200":
          description: List of call notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallNotice"
    post:
      operationId: createCallNotice
      tags: [chamamentos]
      summary: Create a new call notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCallNoticeBody"
      responses:
        "201":
          description: Created call notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallNotice"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/{id}:
    get:
      operationId: getCallNotice
      tags: [chamamentos]
      summary: Get a call notice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call notice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallNoticeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCallNotice
      tags: [chamamentos]
      summary: Update a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCallNoticeBody"
      responses:
        "200":
          description: Updated call notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallNotice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCallNotice
      tags: [chamamentos]
      summary: Delete a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/{id}/files:
    get:
      operationId: listNoticeFiles
      tags: [chamamentos-files]
      summary: List files for a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoticeFile"

  /chamamentos/{id}/requirements:
    get:
      operationId: listCallRequirements
      tags: [chamamentos]
      summary: List extracted requirements for a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallExtractedRequirement"

  /chamamentos/{id}/validation:
    get:
      operationId: listCallValidationItems
      tags: [chamamentos]
      summary: List validation items for a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallValidationItem"

  /chamamentos/{id}/upload-edital:
    post:
      operationId: uploadNoticeEdital
      tags: [chamamentos-files]
      summary: Upload edital PDF for a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeFile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/{id}/upload-document:
    post:
      operationId: uploadNoticeDocument
      tags: [chamamentos-files]
      summary: Upload a document for a call notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                fileType:
                  type: string
              required:
                - file
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeFile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/ai/extract-meta:
    post:
      operationId: extractCallMeta
      tags: [chamamentos-ai]
      summary: Extract metadata from a call notice edital via AI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractCallMetaResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/ai/{id}/analyze-edital:
    post:
      operationId: analyzeCallEdital
      tags: [chamamentos-ai]
      summary: Trigger AI analysis of the uploaded call notice edital
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallAnalysisResult"
        "400":
          description: No edital uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/ai/{id}/analyze-documents:
    post:
      operationId: analyzeCallDocuments
      tags: [chamamentos-ai]
      summary: Trigger AI analysis of submitted OSC documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallAnalysisResult"
        "400":
          description: No documents or requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/validation/{id}:
    patch:
      operationId: updateCallValidationItem
      tags: [chamamentos]
      summary: Update a call validation item status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCallValidationItemBody"
      responses:
        "200":
          description: Updated validation item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallValidationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chamamentos/files/{id}:
    delete:
      operationId: deleteNoticeFile
      tags: [chamamentos-files]
      summary: Delete an uploaded notice file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Process:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        agency:
          type: string
        modality:
          type: string
        editalNumber:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - criado
            - edital_enviado
            - edital_processando
            - exigencias_extraidas
            - aguardando_documentos
            - documentos_enviados
            - em_conferencia
            - pendencias_encontradas
            - pronto_para_revisao
            - concluido
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - agency
        - modality
        - status
        - createdAt
        - updatedAt

    ProcessDetail:
      allOf:
        - $ref: "#/components/schemas/Process"
        - type: object
          properties:
            editalFile:
              oneOf:
                - $ref: "#/components/schemas/UploadedFile"
                - type: "null"
            documentFiles:
              type: array
              items:
                $ref: "#/components/schemas/UploadedFile"
            requirements:
              type: array
              items:
                $ref: "#/components/schemas/ExtractedRequirement"
            validationItems:
              type: array
              items:
                $ref: "#/components/schemas/ValidationItem"
            report:
              oneOf:
                - $ref: "#/components/schemas/FinalReport"
                - type: "null"
          required:
            - documentFiles
            - requirements
            - validationItems

    CreateProcessBody:
      type: object
      properties:
        title:
          type: string
        agency:
          type: string
        modality:
          type: string
        editalNumber:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - title
        - agency
        - modality

    UpdateProcessBody:
      type: object
      properties:
        title:
          type: string
        agency:
          type: string
        modality:
          type: string
        editalNumber:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - criado
            - edital_enviado
            - edital_processando
            - exigencias_extraidas
            - aguardando_documentos
            - documentos_enviados
            - em_conferencia
            - pendencias_encontradas
            - pronto_para_revisao
            - concluido

    UploadedFile:
      type: object
      properties:
        id:
          type: integer
        processId:
          type: integer
        fileType:
          type: string
          enum: [edital, anexo, documento_empresa]
        name:
          type: string
        path:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        uploadedAt:
          type: string
      required:
        - id
        - processId
        - fileType
        - name
        - path
        - mimeType
        - size
        - uploadedAt

    ExtractedRequirement:
      type: object
      properties:
        id:
          type: integer
        processId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        mandatory:
          type: boolean
        sourceExcerpt:
          type: ["string", "null"]
        sourcePage:
          type: ["integer", "null"]
        confidence:
          type: number
        needsReview:
          type: boolean
      required:
        - id
        - processId
        - title
        - mandatory
        - confidence
        - needsReview

    SubmittedDocument:
      type: object
      properties:
        id:
          type: integer
        processId:
          type: integer
        fileId:
          type: integer
        detectedType:
          type: ["string", "null"]
        detectedDate:
          type: ["string", "null"]
        detectedValidity:
          type: ["string", "null"]
        confidence:
          type: number
        needsReview:
          type: boolean
      required:
        - id
        - processId
        - fileId
        - confidence
        - needsReview

    ValidationItem:
      type: object
      properties:
        id:
          type: integer
        processId:
          type: integer
        requirementId:
          type: integer
        submittedDocumentId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [ok, faltando, vencido, divergente, revisar]
        notes:
          type: ["string", "null"]
        requirement:
          $ref: "#/components/schemas/ExtractedRequirement"
        submittedDocument:
          oneOf:
            - $ref: "#/components/schemas/SubmittedDocument"
            - type: "null"
      required:
        - id
        - processId
        - requirementId
        - status
        - requirement

    UpdateValidationItemBody:
      type: object
      properties:
        status:
          type: string
          enum: [ok, faltando, vencido, divergente, revisar]
        notes:
          type: ["string", "null"]
        submittedDocumentId:
          type: ["integer", "null"]

    FinalReport:
      type: object
      properties:
        id:
          type: integer
        processId:
          type: integer
        summary:
          type: string
        okCount:
          type: integer
        missingCount:
          type: integer
        expiredCount:
          type: integer
        divergentCount:
          type: integer
        reviewCount:
          type: integer
        nextSteps:
          type: ["string", "null"]
        generatedAt:
          type: string
      required:
        - id
        - processId
        - summary
        - okCount
        - missingCount
        - expiredCount
        - divergentCount
        - reviewCount
        - generatedAt

    AnalysisResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        processStatus:
          type: string
      required:
        - success
        - message
        - processStatus

    CallNotice:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        agency:
          type: string
        referenceNumber:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - criado
            - edital_enviado
            - edital_processando
            - requisitos_extraidos
            - aguardando_documentos
