kind = "web"
previewPath = "/"
title = "LicitaIA"
version = "1.0.0"
id = "artifacts/licitaia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24747

[services.development]
run = "pnpm --filter @workspace/licitaia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/licitaia", "run", "build" ]
publicDir = "artifacts/licitaia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24747"
BASE_PATH = "/"
